<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0D0D0D">
  <title>Play Nexa — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0D0D0D;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 32px;
    }
    .logo span { color: #7C3AED; }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #1A1A2E;
      border: 2px solid #2D2D44;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      color: #9CA3AF;
      font-size: 14px;
      line-height: 1.6;
      max-width: 280px;
      margin-bottom: 28px;
    }
    button {
      background: #7C3AED;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      font-family: system-ui, sans-serif;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="logo">
    <span>Play</span>Nexa
  </div>
  <div class="icon">
    <svg width="32" height="32" viewBox="0 0 24 24"
      fill="none" stroke="#7C3AED" stroke-width="2">
      <path d="M1 6s4-2 11-2 11 2 11 2"/>
      <path d="M1 12s4-2 11-2 11 2 11 2"/>
      <line x1="1" y1="18" x2="23" y2="18"/>
    </svg>
  </div>
  <h1>You are offline</h1>
  <p>
    Check your internet connection.
    Local music and video files still work offline.
  </p>
  <button onclick="location.reload()">
    Try Again
  </button>
</body>
</html>
